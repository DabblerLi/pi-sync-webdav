name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / Node 22.19.0
            os: ubuntu-latest
            node: '22.19.0'
            quality: false
          - name: Ubuntu / Node 24
            os: ubuntu-latest
            node: '24.x'
            quality: true
          - name: macOS / Node 24
            os: macos-latest
            node: '24.x'
            quality: false
          - name: Windows / Node 24
            os: windows-latest
            node: '24.x'
            quality: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.quality
        run: npm run format:check
      - if: matrix.quality
        run: npm run lint
      - if: matrix.quality
        run: npm run typecheck
      - run: npm test
      - if: matrix.quality
        run: npm run pack:check
